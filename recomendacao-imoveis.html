<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recomendação de imóveis — Praia Digital</title>
  <meta name="description" content="Sugestões personalizadas de imóveis no litoral paulista por perfil do comprador.">
  <link rel="canonical" href="https://praia.digital/ferramentas/recomendacao-imoveis.html">
  <meta name="robots" content="index, follow">
  <style>body{font-family:Arial,sans-serif;margin:0;background:#07112b;color:#fff}.container{max-width:880px;margin:0 auto;padding:24px}.card{background:#0e214d;border-radius:12px;padding:24px;margin-top:16px}.btn{background:#3b82f6;color:white;padding:12px 16px;border-radius:8px;border:0;cursor:pointer;font-size:16px}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0b1a3a;color:#fff;margin-top:8px}.result{background:#0b1a3a;border-radius:8px;padding:16px;margin-top:16px;color:#e2e8f0}</style>
</head>
<body>
<div class="container">
  <h1>Recomendação de imóveis</h1>
  <div class="card">
    <label>Orçamento (R$)</label><input id="o" type="number" value="800000">
    <label>Perfil</label><select id="p"><option value="temporada">Temporada</option><option value="moradia">Moradia</option><option value="investimento">Investimento</option></select>
    <button class="btn" onclick="rec()">Recomendar</button>
    <div class="result" id="res"></div>
  </div>
  <p><a href="index.html" style="color:#9fb3d1">← Voltar para Ferramentas</a></p>
</div>
<script>
function rec(){
  const o=+document.getElementById('o').value,p=document.getElementById('p').value;
  let cidade='Santos';
  if(p==='investimento')cidade=o>1000000?'Guarujá':'Praia Grande';
  else if(p==='temporada')cidade=o>1200000?'Guarujá':'Mongaguá';
  else cidade=o>900000?'Santos':'São Vicente';
  document.getElementById('res').textContent='Perfil '+p+' com até R$ '+o.toLocaleString('pt-BR')+': recomendamos buscar em '+cidade+'. Veja análises no Guia do Litoral e simule o retorno no Simulador ROI.';
}
</script>
